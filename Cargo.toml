[workspace]
members = ["consensus", "database", "mazzarothd", "mvm", "simulation", "utils"]
resolver = "2"

[profile.release]
overflow-checks = true

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
log = "0.4"
log4rs = "1.0"
rocksdb = "0.23"
# rocksdb = {path = "../rust-rocksdb"}
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.9"
crypto-bigint = {version = "0.6", features = ["serde","alloc"]}
secp256k1 = { version = "0.31", features = ["recovery","rand","hashes", "global-context"] }
sha2 = {version = "0.10"}
alloy-rlp = { version = "0.3", features = ["derive"] }
