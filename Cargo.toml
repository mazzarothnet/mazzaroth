[workspace]
members = ["consensus", "database", "mazzarothd", "mining", "mvm", "simulation", "utils"]
resolver = "2"

[profile.release]
overflow-checks = true

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
log = "0.4"
log4rs = "1"
rocksdb = "0.24"
# rocksdb = {path = "../rust-rocksdb"}
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.9"
crypto-bigint = {version = "0.6", features = ["serde","alloc"]}
secp256k1 = { version = "0.31", features = ["recovery","rand","hashes", "global-context"] }
sha2 = {version = "0.10"}
alloy-rlp = { version = "0.3", features = ["derive"] }
bytemuck = "1"
env_logger = "0.11"
pollster = "0.4"
wgpu = "26"
axum = "0.8"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
libp2p = {version = "0.56", features = ["tokio", "gossipsub", "mdns", "noise", "macros", "tcp", "yamux", "quic"]}
jemallocator = "0.5"
lazy_static = "1"
toml = "0.9"
reqwest = { version = "0.12", features = [
    "json",
    "stream",
    "rustls-tls",
], default-features = false }

[workspace.features]
default = []
disable_storage_limit = []

[profile.test]
opt-level = 3
debug = false
lto = "thin"
codegen-units = 1
incremental = false  
debug-assertions = false